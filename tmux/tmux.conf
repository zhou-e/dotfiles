# Splits: prefix | -> left/right panes, prefix v -> top/bottom panes.
# Both open in the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Mouse wheel scrolls tmux history (copy mode); hold Shift to select text for the system clipboard.
set -g mouse on
